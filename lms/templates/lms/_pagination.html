{% load i18n %}
{% if page_obj.has_other_pages %}
<nav class="mg-pagination" aria-label="{% trans 'Pagination' %}">
    {% if page_obj.has_previous %}<a href="?q={{ q|urlencode }}&category={{ category_id|default:'' }}&type={{ exam_type|default:'' }}&page={{ page_obj.previous_page_number }}" aria-label="{% trans 'Previous page' %}"><i class="bi bi-arrow-left"></i></a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?q={{ q|urlencode }}&category={{ category_id|default:'' }}&type={{ exam_type|default:'' }}&page={{ page_obj.next_page_number }}" aria-label="{% trans 'Next page' %}"><i class="bi bi-arrow-right"></i></a>{% endif %}
</nav>
{% endif %}
